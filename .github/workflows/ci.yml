name: BigDeal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Preverjanje projekta
    runs-on: ubuntu-latest

    steps:
      - name: Prenos kode
        uses: actions/checkout@v4

      - name: Nastavitev Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Namestitev odvisnosti
        working-directory: mobile
        run: npm ci

      - name: Preverjanje TypeScript kode
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Preverjanje testnih podatkov
        run: node scripts/validateMockData.cjs
