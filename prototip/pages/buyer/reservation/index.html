
<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rezervacija | BigDeal</title>

    <link rel="stylesheet" href="../../../css/variables.css">
    <link rel="stylesheet" href="../../../css/global.css">
    <link rel="stylesheet" href="../../../components/header.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-shell">
        <div class="phone-frame">

            <header class="app-header app-header--compact">

                <a id="back-link"
                   href="../home/index.html"
                   class="header-icon-button header-back"
                   aria-label="Nazaj">

                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 12H5"></path>
                        <path d="M12 19l-7-7 7-7"></path>
                    </svg>

                </a>

                <h1 class="header-title">Rezervacija</h1>

            </header>

            <main class="page-content">

                <section id="error-message" class="section" hidden>
                    <h2 class="section-title">
                        Rezervacija ni mogoča
                    </h2>

                    <p id="error-description"
                       class="text-secondary"></p>
                </section>

                <form id="reservation-form" hidden>

                    <!-- Izbrana ponudba -->

                    <section class="section">

                        <div class="card offer-summary stack">

                            <h2 id="offer-title"
                                class="card-title"></h2>

                            <p id="business-name"
                               class="text-secondary"></p>

                            <p id="unit-price"></p>

                        </div>

                    </section>

                    <!-- Izbira količine -->

                    <section class="section stack">

                        <h2 class="section-title">
                            Izberi količino
                        </h2>

                        <div class="quantity-selector">

                            <button id="decrease-quantity"
                                    class="btn btn-secondary"
                                    type="button"
                                    aria-label="Zmanjšaj količino">
                                −
                            </button>

                            <output id="quantity-value"
                                    aria-live="polite">1</output>

                            <button id="increase-quantity"
                                    class="btn btn-secondary"
                                    type="button"
                                    aria-label="Povečaj količino">
                                +
                            </button>

                        </div>

                        <p id="available-quantity"
                           class="text-caption"></p>

                    </section>

                    <!-- Izbira termina -->

                    <fieldset class="section stack pickup-slots">

                        <legend class="section-title">
                            Termin prevzema
                        </legend>

                        <div id="pickup-options" class="stack"></div>

                    </fieldset>

                    <!-- Lokacija -->

                    <section class="section stack">

                        <h2 class="section-title">
                            Lokacija prevzema
                        </h2>

                        <p id="pickup-address"
                           class="text-secondary"></p>

                    </section>

                    <!-- Povzetek -->

                    <section class="section stack">

                        <h2 class="section-title">
                            Povzetek rezervacije
                        </h2>

                        <div class="card reservation-summary stack">

                            <div class="summary-row">
                                <span>Količina</span>
                                <span id="summary-quantity"></span>
                            </div>

                            <div class="summary-row">
                                <span>Termin</span>
                                <span id="summary-slot"></span>
                            </div>

                            <div class="summary-row">
                                <span>Redna cena</span>
                                <span id="summary-original-price"></span>
                            </div>

                            <div class="summary-row">
                                <span>Prihranek</span>
                                <span id="summary-saving"></span>
                            </div>

                            <div class="summary-row total-row">
                                <strong>Skupaj</strong>
                                <strong id="summary-total"></strong>
                            </div>

                        </div>

                        <p class="text-caption payment-info">
                            Plačilo ob osebnem prevzemu.
                        </p>

                        <p id="form-error"
                           class="form-error"
                           role="alert"
                           hidden></p>

                        <button id="confirm-button"
                                class="btn btn-primary btn-full"
                                type="submit"
                                disabled>
                            Potrdi rezervacijo
                        </button>

                        <p id="success-message"
                           role="status"
                           hidden></p>

                    </section>

                </form>

            </main>

        </div>
    </div>

    <script src="../../../js/mock-data.js"></script>
    <script src="../../../js/reservation-storage.js"></script>
    <script src="script.js"></script>

</body>
</html>
